[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-ide"
version = "1.0.0"
description = "Interpretador, IDE e compilador multi-linguagem para Linux com design inspirado na Apple"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lumen IDE Contributors" }]
keywords = ["ide", "editor", "gtk4", "libadwaita", "linux", "hyprland", "gnome"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: IDEs",
]

[project.scripts]
lumen-ide = "lumen.main:main"

[tool.setuptools.packages.find]
include = ["lumen*"]

[tool.setuptools.package-data]
lumen = ["style.css", "resources/**/*"]
